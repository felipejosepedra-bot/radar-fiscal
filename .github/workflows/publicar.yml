name: Publicar Radar Fiscal

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'atualizacoes.json'
      - '.github/workflows/publicar.yml'
  workflow_dispatch:
    inputs:
      novos_registros:
        description: 'JSON validado; vazio significa sem alterações'
        required: false
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: central-radar-pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Analisar novas alterações
        if: github.event_name == 'workflow_dispatch'
        id: verificar
        env:
          NOVOS_REGISTROS: ${{ inputs.novos_registros }}
        run: python scripts/atualizar_base.py --github-output "$GITHUB_OUTPUT"
      - name: Gravar somente quando mudar
        if: github.event_name == 'workflow_dispatch' && steps.verificar.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add atualizacoes.json
          git commit -m 'Incorporar alterações ao Radar Fiscal'
          git push origin HEAD:main
      - name: Configurar GitHub Pages
        if: github.event_name == 'push' || steps.verificar.outputs.changed == 'true'
        uses: actions/configure-pages@v5
      - name: Separar arquivos públicos
        if: github.event_name == 'push' || steps.verificar.outputs.changed == 'true'
        run: |
          mkdir -p site_publico
          cp index.html atualizacoes.json site_publico/
          touch site_publico/.nojekyll
      - name: Preparar artefato
        if: github.event_name == 'push' || steps.verificar.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site_publico
      - name: Publicar no Pages
        if: github.event_name == 'push' || steps.verificar.outputs.changed == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
